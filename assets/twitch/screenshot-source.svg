<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" role="img" aria-labelledby="title desc">
  <title id="title">StreamCart extension in action</title>
  <desc id="desc">A live stream frame with the StreamCart creator-controlled product discovery panel open.</desc>
  <defs>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171520"/>
      <stop offset="0.58" stop-color="#23193b"/>
      <stop offset="1" stop-color="#0d0c13"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff7958"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1024" height="768" fill="#09080d"/>
  <rect x="28" y="28" width="968" height="712" rx="28" fill="url(#stream)" stroke="#ffffff18"/>
  <circle cx="270" cy="318" r="168" fill="#8b5cf612" stroke="#8b5cf633" stroke-width="2"/>
  <circle cx="270" cy="318" r="104" fill="#ff79580b" stroke="#ff795833" stroke-width="2"/>
  <circle cx="270" cy="318" r="16" fill="#ff7958"/>
  <path d="M220 266a74 74 0 0 0 0 104M320 266a74 74 0 0 1 0 104" fill="none" stroke="#ff7958" stroke-width="16" stroke-linecap="round"/>
  <path d="M184 230a124 124 0 0 0 0 176M356 230a124 124 0 0 1 0 176" fill="none" stroke="#8b5cf6" stroke-width="16" stroke-linecap="round"/>
  <text x="92" y="590" fill="#f7f5ff" font-family="Arial, sans-serif" font-weight="700" font-size="38">Creator steers the signal.</text>
  <text x="92" y="630" fill="#aaa5b7" font-family="Arial, sans-serif" font-size="21">AI discovers. The creator approves. Viewers choose.</text>
  <rect x="92" y="663" width="240" height="4" rx="2" fill="url(#signal)"/>

  <g filter="url(#shadow)">
    <rect x="610" y="76" width="336" height="616" rx="24" fill="#15121d" stroke="#ffffff20"/>
    <rect x="610" y="76" width="336" height="52" rx="24" fill="#0d0c13"/>
    <rect x="610" y="106" width="336" height="22" fill="#0d0c13"/>
    <text x="636" y="108" fill="#817a8d" font-family="monospace" font-weight="700" font-size="12" letter-spacing="3">NOW IN FRAME</text>
    <circle cx="898" cy="104" r="5" fill="#ff7958"/>
    <text x="910" y="109" fill="#ffb39f" font-family="monospace" font-size="11" letter-spacing="1">LIVE</text>

    <rect x="630" y="148" width="296" height="188" rx="16" fill="#201b2b" stroke="#ffffff12"/>
    <circle cx="778" cy="232" r="64" fill="#8b5cf61c" stroke="#8b5cf655"/>
    <rect x="748" y="183" width="60" height="92" rx="30" fill="#a98bff"/>
    <rect x="767" y="274" width="22" height="28" rx="9" fill="#f7f5ff"/>
    <rect x="738" y="300" width="80" height="9" rx="5" fill="#f7f5ff"/>
    <path d="M728 213c0 48 21 73 50 73s50-25 50-73" fill="none" stroke="#ff7958" stroke-width="7" stroke-linecap="round"/>

    <text x="630" y="365" fill="#a98bff" font-family="monospace" font-weight="700" font-size="11" letter-spacing="2">AI DISCOVERY</text>
    <text x="630" y="397" fill="#f7f5ff" font-family="Arial, sans-serif" font-weight="700" font-size="26">Streaming microphone</text>
    <text x="630" y="423" fill="#c8c3d2" font-family="Arial, sans-serif" font-size="16">Matched to the live topic</text>

    <rect x="630" y="448" width="296" height="55" rx="12" fill="#ffffff08" stroke="#ffffff12"/>
    <circle cx="650" cy="476" r="5" fill="#8b5cf6"/>
    <text x="665" y="481" fill="#d8fff4" font-family="Arial, sans-serif" font-size="15">Creator approved</text>
    <path d="M886 467l7 7 14-16" fill="none" stroke="#ff7958" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="630" y="536" fill="#aaa5b7" font-family="Arial, sans-serif" font-size="14">25+ viewers saved this</text>
    <rect x="630" y="558" width="142" height="56" rx="12" fill="#292434" stroke="#ffffff20"/>
    <text x="658" y="592" fill="#f7f5ff" font-family="Arial, sans-serif" font-weight="700" font-size="15">View catalogue</text>
    <rect x="784" y="558" width="142" height="56" rx="12" fill="#8b5cf6"/>
    <text x="813" y="592" fill="#fff" font-family="Arial, sans-serif" font-weight="700" font-size="15">Save interest</text>
    <text x="630" y="650" fill="#817a8d" font-family="monospace" font-size="11" letter-spacing="1.5">NO PERSONAL TRACKING</text>
  </g>
</svg>
