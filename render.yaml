services:
  - type: web
    name: streamcart-twitchcon-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: 'off'
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: SAFE_SEARCH
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: streamcart-twitchcon-db
          property: connectionString
      - key: CHANNEL3_API_KEY
        sync: false
      - key: CHANNEL3_COLLECTION_ID
        sync: false
      - key: CHANNEL3_COLLECTION_NAME
        value: Twitch
      - key: CHANNEL3_BASE_URL
        value: https://api.trychannel3.com
      - key: CHANNEL3_COUNTRY
        value: US
      - key: CHANNEL3_LANGUAGE
        value: en
      - key: CHANNEL3_CURRENCY
        value: USD
      - key: TWITCH_EXTENSION_SECRET
        sync: false
      - key: TWITCH_WEBHOOK_SECRET
        sync: false
      - key: CATALOGUE_ORIGIN
        value: https://streamcart-twitchcon.vercel.app/catalogue/
      - key: ALLOWED_ORIGINS
        value: https://streamcart-twitchcon.vercel.app,https://3z76w1eigzegdllmz3ud4l2q8bwjly.ext-twitch.tv,https://streamcart-twitchcon-site-20261102.onrender.com
      - key: PRODUCT_URL_HOSTS
        value: buy.trychannel3.com
      - key: IMAGE_URL_HOSTS
        sync: false

  - type: web
    name: streamcart-twitchcon-site-20261102
    runtime: static
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: npm ci && node scripts/build-vercel.mjs
    staticPublishPath: dist/vercel
    routes:
      - type: redirect
        source: /
        destination: /extension/index.html
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_ORIGIN
        value: https://streamcart-twitchcon-api.onrender.com
      - key: VITE_CATALOGUE_ORIGIN
        value: https://streamcart-twitchcon-site-20261102.onrender.com/catalogue/

databases:
  - name: streamcart-twitchcon-db
    plan: free
    region: frankfurt
    databaseName: streamcart
    user: streamcart
